<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>11 · 融资需求</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
.light-stage { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.light-ambient {
  position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
  width: 1600px; height: 700px;
  background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(185,198,212,0.10) 0%, rgba(185,198,212,0.04) 35%, transparent 65%);
  animation: lightReveal 2.4s var(--ease-soft) forwards; opacity: 0;
}
.page-header { margin-bottom: 40px; }
.main-layout { display: flex; gap: 0; flex: 0; max-width: 1200px; margin: 0 auto 0 220px; align-items: center; }
.donut-wrap {
  position: relative; width: 680px; height: 540px;
  opacity: 0; animation: cardReveal 1.1s 0.7s var(--ease-soft) forwards;
  margin: -10px 0 -10px -10px;
}
.donut-wrap svg { width: 100%; height: 100%; }
.donut-col { flex: 0 0 auto; }
.legend-col { flex: 1; display: flex; flex-direction: column; gap: 36px; margin-left: -50px; }
.legend-item {
  display: flex; align-items: center; gap: 18px;
  font-family: var(--font-sans); font-size: 20px; font-weight: 400; color: var(--text-primary);
  opacity: 0; animation: textFadeUp 0.8s var(--ease-soft) forwards;
}
.legend-item:nth-child(1) { animation-delay: 1.0s; }
.legend-item:nth-child(2) { animation-delay: 1.2s; }
.legend-item:nth-child(3) { animation-delay: 1.4s; }
.legend-item:nth-child(4) { animation-delay: 1.6s; }
.legend-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
.legend-body { flex: 1; }
.legend-title { font-size: 21px; font-weight: 500; color: var(--text-primary); }
.legend-desc { font-size: 18px; font-weight: 300; color: var(--text-tertiary); display: block; margin-top: 2px; }
.legend-pct { font-family: var(--font-serif); font-size: 26px; font-weight: 500; color: var(--accent); flex-shrink: 0; }
.deco-sphere { position: fixed; border-radius: 50%; pointer-events: none; z-index: 998; filter: blur(80px); }
.deco-bl { bottom: -300px; left: -200px; width: 900px; height: 700px; background: radial-gradient(ellipse 60% 55% at 45% 40%, rgba(200,190,175,0.18) 0%, rgba(195,185,170,0.06) 35%, transparent 65%); }
.deco-tr { top: -250px; right: -150px; width: 800px; height: 600px; background: radial-gradient(ellipse 55% 50% at 55% 50%, rgba(175,190,210,0.15) 0%, rgba(180,195,215,0.05) 30%, transparent 62%); }
</style>
</head>
<body>
<div class="light-stage"><div class="light-ambient"></div></div>
<div class="content">
  <div class="page-header">
    <h1 class="page-title">融资需求</h1>
    <p class="page-subtitle">「天使轮融资，加速从 1 到 100 的跨越」</p>
  </div>
  <div class="main-layout">
    <div class="donut-col">
      <div class="donut-wrap">
        <svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg">
          <!-- Donut: r=130 sw=70, circ=816.814, 40:30:20:10 -->
          <circle cx="220" cy="250" r="130" fill="none" stroke="#4A5568" stroke-width="70"
            stroke-dasharray="326.726 490.088" stroke-dashoffset="0" transform="rotate(-90 220 250)" />
          <circle cx="220" cy="250" r="130" fill="none" stroke="#6B7D92" stroke-width="70"
            stroke-dasharray="245.044 571.770" stroke-dashoffset="-326.726" transform="rotate(-90 220 250)" />
          <circle cx="220" cy="250" r="130" fill="none" stroke="#8B9DAD" stroke-width="70"
            stroke-dasharray="163.362 653.452" stroke-dashoffset="-571.770" transform="rotate(-90 220 250)" />
          <circle cx="220" cy="250" r="130" fill="none" stroke="#A0B0BC" stroke-width="70"
            stroke-dasharray="81.682 735.132" stroke-dashoffset="-735.132" transform="rotate(-90 220 250)" />

          <!-- Center text -->
          <text x="220" y="245" text-anchor="middle" font-family="'Newsreader','Cormorant Garamond',Georgia,serif" font-size="40" font-weight="500" fill="#1A1A1A">20–50 万</text>
          <text x="220" y="275" text-anchor="middle" font-family="'Inter',sans-serif" font-size="17" fill="#999">出让 10% 股份</text>

        </svg>
      </div>
    </div>
    <div class="legend-col">
      <div class="legend-item">
        <div class="legend-dot" style="background:#4A5568"></div>
        <div class="legend-body">
          <div class="legend-title">研发与算力</div>
          <div class="legend-desc">代码开发及大模型调用成本</div>
        </div>
        <span class="legend-pct">40%</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#6B7D92"></div>
        <div class="legend-body">
          <div class="legend-title">产品迭代</div>
          <div class="legend-desc">AI 模型微调与功能体验优化</div>
        </div>
        <span class="legend-pct">30%</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#8B9DAD"></div>
        <div class="legend-body">
          <div class="legend-title">运营</div>
          <div class="legend-desc">留学生社群渗透与初期用户增长</div>
        </div>
        <span class="legend-pct">20%</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#A0B0BC"></div>
        <div class="legend-body">
          <div class="legend-title">法务</div>
          <div class="legend-desc">合规审核与相关资质办理</div>
        </div>
        <span class="legend-pct">10%</span>
      </div>
    </div>
  </div>
</div>
<div class="bottom-tagline"><div class="tagline-line"></div><div class="tagline-text">仅供投资人内部参考</div></div>
<div class="deco-sphere deco-bl"></div><div class="deco-sphere deco-tr"></div>
</body>
</html>
