<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 · 项目概要</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
.light-stage { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.light-ambient {
  position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
  width: 1600px; height: 700px;
  background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(185,198,212,0.10) 0%, rgba(185,198,212,0.04) 35%, transparent 65%);
  animation: lightReveal 2.4s var(--ease-soft) forwards; opacity: 0;
}

.page-header { margin-bottom: 40px; }

/* ——— Circular Flow Layout ——— */
.flow-stage {
  position: relative; z-index: 1; flex: 0;
  display: flex; align-items: center; justify-content: center;
  margin-top: 10px;
}

/* Center product definition */
.center-block {
  position: absolute;
  text-align: center;
  z-index: 2;
  opacity: 0; animation: cardReveal 1.1s 0.7s var(--ease-soft) forwards;
}
.center-name {
  font-family: var(--font-serif); font-size: 68px; font-weight: 500;
  letter-spacing: 0.04em; color: var(--text-primary); line-height: 1;
  margin-bottom: 12px;
}
.center-name .dot { font-family: var(--font-sans); font-weight: 300; color: var(--accent); }
.center-sub {
  font-family: var(--font-sans); font-size: 18px; font-weight: 300;
  line-height: 1.7; color: var(--text-secondary);
  margin-top: 8px;
}

/* Ring connector SVG — open arc from top to left (clockwise ~270°) */
.ring-svg {
  position: absolute; width: 620px; height: 620px;
  pointer-events: none; z-index: 0;
  opacity: 0; animation: fadeIn 1.5s 0.9s var(--ease-soft) forwards;
}
.ring-path {
  fill: none; stroke: rgba(74,85,104,0.16); stroke-width: 1.5;
  stroke-dasharray: 1130 1520;
  stroke-dashoffset: 0;
}
/* Individual node */
.flow-node {
  position: absolute; z-index: 1;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px;
  opacity: 0; animation: cardReveal 1.1s var(--ease-soft) forwards;
}

.node-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 6px rgba(74,85,104,0.08);
}
.node-label {
  font-family: var(--font-sans); font-size: 18px; font-weight: 500;
  letter-spacing: 0.06em; color: var(--text-primary);
  white-space: nowrap;
}
.node-sub {
  font-family: var(--font-sans); font-size: 15px; font-weight: 300;
  letter-spacing: 0.04em; color: var(--text-tertiary);
  max-width: 175px; line-height: 1.5;
}

/* Decorative spheres */
.deco-sphere { position: fixed; border-radius: 50%; pointer-events: none; z-index: 998; filter: blur(80px); }
.deco-bl { bottom: -300px; left: -200px; width: 900px; height: 700px; background: radial-gradient(ellipse 60% 55% at 45% 40%, rgba(200,190,175,0.18) 0%, rgba(195,185,170,0.06) 35%, transparent 65%); }
.deco-tr { top: -250px; right: -150px; width: 800px; height: 600px; background: radial-gradient(ellipse 55% 50% at 55% 50%, rgba(175,190,210,0.15) 0%, rgba(180,195,215,0.05) 30%, transparent 62%); }
</style>
</head>
<body>

<div class="light-stage"><div class="light-ambient"></div></div>

<div class="content">
  <div class="page-header">
    <h1 class="page-title">项目概要</h1>
    <p class="page-subtitle">一款微信小程序，从工具到平台的进化路径</p>
  </div>

  <div class="flow-stage" style="width:960px;height:620px;margin:0 auto;position:relative;">

    <!-- Ring SVG: open arc from top (微信小程序) clockwise to left (B端SaaS), ~270° -->
    <svg class="ring-svg" viewBox="0 0 620 620" style="top:0;left:170px;">
      <path class="ring-path" d="M 310 110 A 280 200 0 1 1 35 315" />
    </svg>

    <!-- Center: Product Definition -->
    <div class="center-block" style="top:225px;left:240px;width:480px;">
      <div class="center-name">Essay<span class="dot">AI</span></div>
      <div class="center-sub">输入背景经历，生成个性化申请文书<br>匹配标准格式，一键下载文档</div>
    </div>

    <!-- Node 1: Top — 微信小程序 -->
    <div class="flow-node" style="top:40px;left:400px;animation-delay:0.7s;">
      <div class="node-dot"></div>
      <div class="node-label">微信小程序</div>
      <div class="node-sub">流量入口<br>社交裂变零成本获客</div>
    </div>

    <!-- Node 2: Right — C端验证 -->
    <div class="flow-node" style="top:250px;left:780px;animation-delay:0.9s;">
      <div class="node-dot"></div>
      <div class="node-label">C 端验证</div>
      <div class="node-sub">验证 PMF<br>积累用户反馈迭代</div>
    </div>

    <!-- Node 3: Bottom — 数据积累 -->
    <div class="flow-node" style="top:480px;left:400px;animation-delay:1.1s;">
      <div class="node-dot"></div>
      <div class="node-label">数据积累</div>
      <div class="node-sub">用户数据持续增长<br>优质文书加入知识库</div>
    </div>

    <!-- Node 4: Left — B端SaaS -->
    <div class="flow-node" style="top:250px;left:20px;animation-delay:1.3s;">
      <div class="node-dot"></div>
      <div class="node-label">B 端 SaaS</div>
      <div class="node-sub">顶级模型 + 专属知识库<br>面向工作室和中介的平台</div>

  </div>
</div>

<div class="bottom-tagline">
  <div class="tagline-line"></div>
  <div class="tagline-text">小程序入口 → C端验证 → 数据积累 → B端SaaS</div>
</div>

<div class="deco-sphere deco-bl"></div>
<div class="deco-sphere deco-tr"></div>
</body>
</html>
